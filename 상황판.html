<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕포 상황판</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* 상황판 고유 스타일만 남긴다 — 공용 토큰·nav·card·badge·kpi·게이트는 theme.css */
  .deadline-item { display: flex; align-items: baseline; gap: 12px; }
  .deadline-item .dday { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 62px; }
  .deadline-item .dday.danger { color: var(--danger); }
  .deadline-item .dday.warn { color: var(--warn); }
  .deadline-item .dday.ok { color: var(--ok); }

  .issue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .issue-card .card-head { justify-content: space-between; }
  .issue-card .no { color: var(--accent); font-weight: 700; font-size: .82rem; }
  .issue-card .card-body { cursor: pointer; }
  .issue-detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: .82rem; color: var(--text-sub); }
  .issue-card.open .issue-detail { display: block; }
  .issue-detail dt { font-weight: 600; color: var(--text); margin-top: 6px; }
  .issue-detail dt:first-child { margin-top: 0; }
  .issue-detail dd { margin-left: 0; }
</style>
</head>
<body>
<div id="authGate">
  <div class="gate-card">
    <h2><span>🔐</span> <span id="gateTitle">로그인</span></h2>
    <p id="gateDesc">확인 중...</p>
    <div id="gateRoles" style="display:none">
      <button type="button" class="role-btn" id="roleP">🏛️ 대통령 등록</button>
      <button type="button" class="role-btn" id="roleA">🛠️ 관리자 등록</button>
    </div>
    <div id="gateForm" style="display:none">
      <input type="email" id="gateEmail" placeholder="이메일" autocomplete="username">
      <input type="password" id="gatePw" placeholder="비밀번호" autocomplete="current-password">
      <div id="gatePw2Wrap" style="display:none">
        <input type="password" id="gatePw2" placeholder="비밀번호 확인" autocomplete="new-password">
      </div>
      <button id="gateBtn">로그인</button>
    </div>
    <div class="gate-links"><a href="#" id="gateSwitch" style="display:none"></a></div>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div class="wrap">
  <nav id="siteNav"></nav>

  <header>
    <h1><span>🧭</span> 상황판</h1>
    <p>사건 전체 현황 — 기한 · 처분 · 쟁점 준비도 · 사실 상충을 한눈에</p>
    <p class="asof" id="asof"></p>
  </header>

  <div id="content" class="loading">불러오는 중...</div>

  <footer>duckpo · 덕포산업단지 상황판 · 매 조회 시 실시간 계산</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function ddayBadgeClass(days) {
  if (days < 0) return 'danger';
  if (days <= 14) return 'danger';
  if (days <= 30) return 'warn';
  return 'ok';
}
function ddayText(days) {
  if (days < 0) return `D+${Math.abs(days)} 도과`;
  if (days === 0) return 'D-Day';
  return `D-${days}`;
}

function kpiCard(num, label, tone) {
  return `<div class="kpi ${tone||''}"><div class="num">${num}</div><div class="label">${esc(label)}</div></div>`;
}

function renderKpis(axis, intake) {
  const cells = [
    kpiCard(axis.기한도과_뼈대, '기한 도과', axis.기한도과_뼈대 > 0 ? 'danger' : 'ok'),
    kpiCard(axis.기한임박_뼈대, '기한 임박(30일내)', axis.기한임박_뼈대 > 0 ? 'warn' : 'ok'),
    kpiCard(axis.유효쟁점, '유효 쟁점', 'ok'),
    kpiCard(axis.미해소상충, '미해소 사실상충', axis.미해소상충 > 0 ? 'warn' : 'ok'),
    kpiCard(axis.미연결사실, '쟁점 미연결 사실', axis.미연결사실 > 0 ? 'warn' : 'ok'),
    kpiCard(intake.신규미판독, '신규 미판독', intake.신규미판독 > 0 ? 'danger' : 'ok'),
    kpiCard(intake.기록미판독, '기록 미판독', intake.기록미판독 > 0 ? 'warn' : 'ok'),
  ];
  return `<div class="kpi-grid">${cells.join('')}</div>`;
}

function renderDeadlines(rows) {
  if (!rows.length) return `<div class="empty-note">등재된 불가역 기한이 없습니다.</div>`;
  return rows.map(r => {
    const cls = ddayBadgeClass(r.잔여일);
    const confirm = r.법적확정여부 === '변호사확인완료'
      ? `<span class="badge ok">변호사확인완료</span>`
      : `<span class="badge neutral">미확정 — 단정 인용 금지</span>`;
    return `
      <div class="card">
        <div class="card-head deadline-item">
          <div class="dday ${cls}">${ddayText(r.잔여일)}</div>
          <div class="card-title">${esc(r.종류)} — ${esc(r.만료일)} 만료</div>
          ${confirm}
        </div>
        <div class="card-body">
          <div>기산: ${esc(r.기산일)} (${esc(r.기산근거)})</div>
          <div>만료근거: ${esc(r.만료근거)}</div>
          ${r.비고 ? `<div style="margin-top:4px">${esc(r.비고)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function statusBadgeClass(s) {
  if (s === '유효') return 'ok';
  if (s === '취소' || s === '실효') return 'danger';
  return 'neutral';
}

function renderDispositions(rows) {
  if (!rows.length) return `<div class="empty-note">등재된 처분이 없습니다.</div>`;
  const trs = rows.map(r => `
    <tr>
      <td>${esc(r.처분일)}</td>
      <td>${esc(r.disposition_no)}</td>
      <td>${esc(r.처분청)}</td>
      <td>${esc(r.처분내용)}</td>
      <td><span class="badge ${statusBadgeClass(r.현재상태)}">${esc(r.현재상태)}</span></td>
    </tr>`).join('');
  return `
    <div class="table-wrap">
      <table class="disp-table">
        <thead><tr><th>처분일</th><th>번호</th><th>처분청</th><th>내용</th><th>상태</th></tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
}

function renderIssues(issues, readySet, gapMap) {
  const cards = issues.map(i => {
    const gapCount = gapMap.get(i.issue_no);
    const readyBadge = (gapCount === undefined)
      ? `<span class="badge ok">즉시 주장 가능</span>`
      : `<span class="badge warn">미확정 ${gapCount}건</span>`;
    const targets = (i.대상 || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const factList = (i.필요사실 || []).map(f => `<span class="tag">${esc(f)}</span>`).join('') || '없음';
    return `
      <div class="card issue-card">
        <div class="card-head">
          <span class="no">${esc(i.issue_no)}</span>
          ${readyBadge}
        </div>
        <div class="card-title" style="margin-top:6px; font-weight:500; font-size:.9rem;">${esc(i.쟁점)}</div>
        <div class="card-body" data-toggle="issue">${targets}<span style="float:right">자세히 ▾</span></div>
        <dl class="issue-detail">
          <dt>필요사실 (${(i.필요사실 || []).length}건)</dt><dd>${factList}</dd>
          <dt>강도</dt><dd>${esc(i.강도 || '미기재')}</dd>
          <dt>반박위험</dt><dd>${esc(i.반박위험 || '미기재')}</dd>
          <dt>법적근거</dt><dd>${esc(i.법적근거 || '미기재')}</dd>
        </dl>
      </div>`;
  }).join('');
  return `<div class="issue-grid">${cards}</div>`;
}

function renderConflicts(rows) {
  const open = rows.filter(r => !r.해소여부);
  if (!open.length) return `<div class="empty-note">미해소 사실상충이 없습니다.</div>`;
  return open.map(r => `
    <div class="card">
      <div class="card-head">
        <span class="badge warn">${esc(r.충돌유형)}</span>
        <div class="card-title">${esc(r.fact_a)} ↔ ${esc(r.fact_b)}</div>
      </div>
      <div class="card-body">${esc(r.설명)}</div>
    </div>`).join('');
}

duckpo.requireLogin(async (sb) => {
  const content = document.getElementById('content');
  try {
    const [axisRes, intakeRes, deadlineRes, dispRes, conflictRes, issueRes, readyRes, gapRes] = await Promise.all([
      sb.from('v_axis_board').select('*').single(),
      sb.from('v_intake_status').select('*').single(),
      sb.from('v_deadline_critical_watch').select('*').order('잔여일', { ascending: true }),
      sb.from('disposition').select('*').order('처분일', { ascending: true }),
      sb.from('fact_conflict').select('*').order('id', { ascending: true }),
      sb.from('issue').select('issue_no, 상태, 쟁점, 대상, 필요사실, 강도, 반박위험, 법적근거').order('issue_no', { ascending: true }),
      sb.from('v_issue_ready').select('issue_no'),
      sb.from('v_issue_gap').select('issue_no, 미확정사실'),
    ]);

    const errs = [axisRes, intakeRes, deadlineRes, dispRes, conflictRes, issueRes, readyRes, gapRes]
      .map(r => r.error).filter(Boolean);
    if (errs.length) throw errs[0];

    const axis = axisRes.data;
    const intake = intakeRes.data;
    const readySet = new Set((readyRes.data || []).map(r => r.issue_no));
    const gapMap = new Map((gapRes.data || []).map(r => [r.issue_no, (r.미확정사실 || []).length]));

    document.getElementById('asof').textContent = '조회 시각: ' + new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });

    content.className = '';
    content.innerHTML = `
      ${renderKpis(axis, intake)}

      <section>
        <h2>⏰ 기한 시계</h2>
        <div class="sub">불가역 기한(제소기간·시효 등) — 도과·임박 순. "미확정"은 변호사 확인 전까지 대외 문서에 단정 인용하지 않습니다.</div>
        ${renderDeadlines(deadlineRes.data || [])}
      </section>

      <section>
        <h2>📜 처분 현황</h2>
        <div class="sub">사건의 기본 단위인 행정처분 대장 — 어느 것이 아직 살아있는 처분인지.</div>
        ${renderDispositions(dispRes.data || [])}
      </section>

      <section>
        <h2>🧩 쟁점 준비도</h2>
        <div class="sub">쟁점 ${issueRes.data.length}건 중 즉시 주장 가능 ${readySet.size}건. 대상(변호사·행정·언론 등)은 이 쟁점을 어디에 쓸 수 있는지를 뜻합니다.</div>
        ${renderIssues(issueRes.data || [], readySet, gapMap)}
      </section>

      <section>
        <h2>⚠️ 사실 상충 경보</h2>
        <div class="sub">한 사실이 서로 다른 쟁점에서 반대로 작동하는 경우 — 같은 문서에 함께 쓸 때 반박 위험을 미리 다뤄야 합니다.</div>
        ${renderConflicts(conflictRes.data || [])}
      </section>
    `;
    content.querySelectorAll('.issue-card [data-toggle="issue"]').forEach(el => {
      el.addEventListener('click', () => el.closest('.issue-card').classList.toggle('open'));
    });
  } catch (e) {
    content.className = '';
    content.innerHTML = `<div class="empty-note">불러오기 실패: ${esc(e.message || String(e))}</div>`;
  }
});
</script>
</body>
</html>
