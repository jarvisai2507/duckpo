<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덕포 일일 기록</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* 게시판 고유 스타일만 남긴다 — 공용 토큰·nav·게이트는 theme.css */
  .wrap { max-width: 760px; }  /* 본문 읽기용이라 다른 페이지보다 좁게 */

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font-size: .95rem;
    outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .count { color: var(--text-sub); font-size: .85rem; white-space: nowrap; }

  .day { margin-bottom: 28px; }
  .day-header {
    display: flex; align-items: baseline; gap: 8px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  .day-header h2 { font-size: 1.05rem; color: var(--accent); }
  .day-header .weekday { font-size: .85rem; color: var(--text-sub); }
  .day-header .day-count { margin-left: auto; font-size: .8rem; color: var(--text-sub); }

  .post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .post-head {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 14px 16px;
    background: none; border: none;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .post-head:hover { background: var(--accent-soft); }
  .post-title { font-weight: 600; flex: 1; }
  .post-time { color: var(--text-sub); font-size: .82rem; white-space: nowrap; }
  .chevron { color: var(--text-sub); transition: transform .2s; font-size: .8rem; }
  .post.open .chevron { transform: rotate(90deg); }

  .post-body {
    display: none;
    padding: 4px 16px 16px;
    border-top: 1px dashed var(--border);
    color: var(--text);
    font-size: .95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .post.open .post-body { display: block; }
  .post-detail { margin-top: 14px; padding-top: 4px; }
  .post-detail-sep {
    text-align: center; color: var(--text-sub);
    font-size: .78rem; margin-bottom: 8px;
  }

  .empty {
    text-align: center; color: var(--text-sub);
    padding: 60px 0; font-size: .95rem;
  }

  .filter-banner {
    display: none; align-items: center; gap: 10px;
    margin-bottom: 16px; padding: 10px 14px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 10px; font-size: .9rem;
  }
  .filter-banner.on { display: flex; }
  .filter-banner a { color: var(--accent); font-weight: 600; margin-left: auto; }

  .dept {
    background: var(--accent-soft); color: var(--accent);
    font-size: .75rem; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap; font-weight: 600;
  }

  /* 카테고리 뱃지·탭 색은 DB(category_meta)에서 읽어 인라인 스타일로 적용한다 — 코드 수정 없이 색을 바꿀 수 있게 하기 위함 */
  .cat {
    font-size: .75rem; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap; font-weight: 600;
  }

  .cat-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .cat-tab {
    padding: 6px 14px; border-radius: 999px;
    text-decoration: none; font-size: .85rem; font-weight: 600;
    border: 1px solid var(--border); color: var(--text-sub);
    background: var(--card);
  }
  .cat-tab.active-all { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div id="authGate">
  <div class="gate-card">
    <h2><span>🔐</span> <span id="gateTitle">로그인</span></h2>
    <p id="gateDesc">확인 중...</p>
    <div id="gateRoles" style="display:none">
      <button type="button" class="role-btn" id="roleP">🏛️ 대통령 등록</button>
      <button type="button" class="role-btn" id="roleA">🛠️ 관리자 등록</button>
    </div>
    <div id="gateForm" style="display:none">
      <input type="email" id="gateEmail" placeholder="이메일" autocomplete="username">
      <input type="password" id="gatePw" placeholder="비밀번호" autocomplete="current-password">
      <div id="gatePw2Wrap" style="display:none">
        <input type="password" id="gatePw2" placeholder="비밀번호 확인" autocomplete="new-password">
      </div>
      <button id="gateBtn">로그인</button>
    </div>
    <div class="gate-links"><a href="#" id="gateSwitch" style="display:none"></a></div>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div class="wrap">
  <nav id="siteNav"></nav>

  <header>
    <h1><span class="icon">📋</span> 덕포 일일 기록</h1>
    <p>날짜별로 하루의 대화와 일들을 기록하는 게시판</p>
  </header>

  <div class="cat-tabs" id="catTabs"></div>

  <div class="filter-banner" id="filterBanner">
    <span id="filterLabel"></span>
    <a href="index.html">전체 보기 ✕</a>
  </div>

  <div class="toolbar">
    <input type="search" id="search" class="search" placeholder="제목이나 내용으로 검색...">
    <span class="count" id="count"></span>
  </div>

  <main id="board"></main>

  <footer>duckpo · 덕포산업단지 일일 기록</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script>
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
let allPosts = [];

// 탭 이름·색은 코드에 박아두지 않고 DB(category_meta)에서 읽는다.
// 대통령이 이름·색을 바꾸고 싶으면 이 표만 고치면 되고, 코드 재배포가 필요 없다.
// 조회 실패 시를 대비한 기본값(화면이 깨지지 않도록).
let CAT_META = {
  '변호사':   { label: '변호사',   emoji: '🔵', color: '#2563eb', color_soft: '#eff6ff', sort_order: 1 },
  '언론':     { label: '언론',     emoji: '🟠', color: '#ea580c', color_soft: '#fff7ed', sort_order: 2 },
  '시민단체': { label: '시민단체', emoji: '🟢', color: '#16a34a', color_soft: '#f0fdf4', sort_order: 3 },
  '형사':     { label: '형사',     emoji: '🔴', color: '#dc2626', color_soft: '#fef2f2', sort_order: 4 },
  '민사':     { label: '민사',     emoji: '🟣', color: '#7c3aed', color_soft: '#f5f3ff', sort_order: 5 },
};

function renderCatTabs() {
  const cats = Object.keys(CAT_META).sort((a, b) => CAT_META[a].sort_order - CAT_META[b].sort_order);
  const tabs = ['<a href="index.html" class="cat-tab" data-cat="">전체</a>'];
  cats.forEach(c => {
    const m = CAT_META[c];
    tabs.push(`<a href="index.html?category=${encodeURIComponent(c)}" class="cat-tab" data-cat="${escapeHtml(c)}">${m.emoji} ${escapeHtml(m.label)}</a>`);
  });
  document.getElementById('catTabs').innerHTML = tabs.join('');
}

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return `${y}년 ${m}월 ${d}일`;
}
function weekday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(y, m - 1, d).getDay()] + '요일';
}

function render(posts) {
  const board = document.getElementById('board');
  const count = document.getElementById('count');
  count.textContent = `총 ${posts.length}개의 기록`;

  if (posts.length === 0) {
    board.innerHTML = '<div class="empty">기록이 없습니다.</div>';
    return;
  }

  const byDate = {};
  posts.forEach(p => (byDate[p.date] ??= []).push(p));
  const dates = Object.keys(byDate).sort().reverse();

  board.innerHTML = '';
  dates.forEach(date => {
    const dayPosts = byDate[date].slice().sort((a, b) => (b.time || '').localeCompare(a.time || ''));
    const day = document.createElement('section');
    day.className = 'day';
    day.innerHTML = `
      <div class="day-header">
        <h2>${formatDate(date)}</h2>
        <span class="weekday">${weekday(date)}</span>
        <span class="day-count">${dayPosts.length}건</span>
      </div>`;
    dayPosts.forEach(p => {
      const article = document.createElement('article');
      article.className = 'post';
      const tags = (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      const dept = p.dept ? `<span class="dept">${escapeHtml(p.dept)}</span>` : '';
      const catMeta = CAT_META[p.category];
      const cat = catMeta
        ? `<span class="cat" style="background:${catMeta.color_soft};color:${catMeta.color}">${catMeta.emoji} ${escapeHtml(catMeta.label)}</span>`
        : '';
      article.innerHTML = `
        <button class="post-head" aria-expanded="false">
          <span class="chevron">▶</span>
          <span class="post-title">${escapeHtml(p.title)}</span>
          ${cat}${dept}${tags}
          <span class="post-time">${escapeHtml(p.time || '')}</span>
        </button>
        <div class="post-body">${escapeHtml(p.summary)}${p.detail ? `<div class="post-detail"><div class="post-detail-sep">─ 상세내용 ─</div>${escapeHtml(p.detail)}</div>` : ''}</div>`;
      article.querySelector('.post-head').addEventListener('click', () => {
        const open = article.classList.toggle('open');
        article.querySelector('.post-head').setAttribute('aria-expanded', open);
      });
      day.appendChild(article);
    });
    board.appendChild(day);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

let activeDept = new URLSearchParams(location.search).get('dept');
let activeCategory = new URLSearchParams(location.search).get('category');
let basePosts = [];  // dept·category 필터 적용 후 기준 집합 (검색은 이 집합 위에서)

function applyDeptFilter() {
  const banner = document.getElementById('filterBanner');
  basePosts = allPosts;
  if (activeDept) basePosts = basePosts.filter(p => p.dept === activeDept);
  if (activeCategory) basePosts = basePosts.filter(p => p.category === activeCategory);

  const labels = [];
  if (activeCategory) {
    const meta = CAT_META[activeCategory];
    labels.push(`${meta ? meta.emoji + ' ' + meta.label : '🏷️ ' + activeCategory} 게시판`);
  }
  if (activeDept) labels.push(`🏷️ ${activeDept} 기록`);

  if (labels.length) {
    document.getElementById('filterLabel').textContent = labels.join(' · ') + '만 보기';
    banner.classList.add('on');
  } else {
    banner.classList.remove('on');
  }

  document.querySelectorAll('.cat-tab').forEach(a => {
    const tabCat = a.dataset.cat;
    const isActive = tabCat === (activeCategory || '');
    a.className = 'cat-tab';
    a.removeAttribute('style');
    if (!isActive) return;
    if (!tabCat) { a.classList.add('active-all'); return; }
    const m = CAT_META[tabCat];
    if (m) a.setAttribute('style', `background:${m.color};color:#fff;border-color:${m.color}`);
  });
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { render(basePosts); return; }
  render(basePosts.filter(p =>
    p.title.toLowerCase().includes(q) ||
    p.summary.toLowerCase().includes(q) ||
    (p.tags || []).some(t => t.toLowerCase().includes(q))
  ));
});

duckpo.requireLogin(async (sb) => {
  const [{ data, error }, catRes] = await Promise.all([
    sb.from('posts')
      .select('id,date,time,title,summary,detail,tags,dept,category')
      .order('date', { ascending: false })
      .order('time', { ascending: false }),
    sb.from('category_meta').select('category,label,emoji,color,color_soft,sort_order'),
  ]);
  if (error) {
    document.getElementById('board').innerHTML =
      '<div class="empty">기록을 불러오지 못했습니다. (Supabase 연결 확인 필요)</div>';
    return;
  }
  if (!catRes.error && catRes.data && catRes.data.length) {
    CAT_META = {};
    catRes.data.forEach(m => { CAT_META[m.category] = m; });
  } // 실패 시 코드에 있는 기본값을 그대로 쓴다
  renderCatTabs();
  allPosts = data;
  applyDeptFilter();
  render(basePosts);
});
</script>
</body>
</html>
