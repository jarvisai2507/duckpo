name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # auto-publish(Auto merge to main)가 머지 후 이 워크플로를 main ref로 dispatch한다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages Source가 "GitHub Actions"일 때만 성공한다.
      # "Deploy from a branch" 소스이거나 Pages가 꺼져 있으면 여기서 실패하는데,
      # 그 경우는 아래 단계를 건너뛰어 잡을 실패시키지 않는다.
      # (branch 소스면 main push만으로 GitHub이 알아서 배포하므로 Actions 배포는 불필요.)
      - id: cp
        name: Configure Pages (GitHub Actions source)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages가 GitHub Actions 소스가 아님
        if: steps.cp.outcome != 'success'
        run: |
          echo "Pages Source가 'GitHub Actions'가 아니거나 Pages가 비활성 상태입니다."
          echo "→ Actions 배포는 건너뜁니다. (branch 소스라면 main push만으로 자동 배포됩니다.)"

      # 배포물에는 화면에 필요한 파일만 담는다.
      # 저장소 루트를 그대로 올리면 CLAUDE.md·docs/·.claude/ 등 내부 문서가
      # 정적 파일로 공개된다(로그인 게이트는 화면 표시만 통제하므로 막지 못한다).
      #
      # 이 목록은 세 번째 시도다. ①이름 나열(2026.7.24) — 새 페이지 추가 시
      # 이 파일을 안 고치면 조용히 누락(2026.8.5 상황판.html 실사고).
      # ②*.html 전부 자동 포함(2026.8.5 당일 1차 수정) — auto-publish.yml이
      # 사람 검토 없이 즉시 main에 배포하는 구조라, 세션 중 남긴 스크래치
      # .html이 그대로 함께 배포될 위험이 실측됨.
      # ③id="authGate" 문자열 포함 여부로 판정(2026.8.5 당일 2차 수정) —
      # 같은 날 2차 독립검증에서 **양방향으로** 뚫림이 실측됨: 기존 페이지를
      # 복사해 만든 초안(예: 초안_내부메모.html)도 그 문자열을 그대로 갖고
      # 있어 함께 배포되고(과다포함), 반대로 작은따옴표(id='authGate') 등
      # 표기가 조금만 달라도 조용히 누락된다(과소포함) — 둘 다 실제로
      # 재현됨. 그래서 다시 명시적 목록으로 돌아가되, 이번엔 **개수까지
      # 검증**해 "몇 개가 왜 빠졌는지" 조용히 지나가지 않게 한다.
      - name: Stage site files (explicit manifest)
        if: steps.cp.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          PAGES=(index.html org.html 상황판.html 타임라인.html)
          ASSETS=(auth.js theme.css nav.js)
          for f in "${PAGES[@]}" "${ASSETS[@]}"; do
            test -f "$f" || { echo "::error::배포 목록에 있는 파일이 저장소에 없다: $f"; exit 1; }
            cp "$f" _site/
          done
          EXPECTED=$(( ${#PAGES[@]} + ${#ASSETS[@]} ))
          ACTUAL=$(find _site -type f | wc -l)
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::배포 파일 수 불일치 — 기대 ${EXPECTED}건, 실제 ${ACTUAL}건"; exit 1
          fi
          # 안전판: 허용 확장자(html/js/css) 외 파일이 섞였는지 재확인.
          # `find | grep -q` 조합은 grep이 첫 매치에서 먼저 종료해 find가
          # SIGPIPE로 죽고 pipefail 때문에 조용히 통과할 수 있어(2026.8.5
          # 2차 독립검증 적발), wc -l로 전량을 소비해 세는 방식으로 쓴다.
          EXTRA=$(find _site -type f ! -name '*.html' ! -name '*.js' ! -name '*.css' | wc -l)
          if [ "$EXTRA" -ne 0 ]; then
            echo "::error::_site 에 허용 확장자 외 파일 ${EXTRA}건이 있다"; find _site -type f; exit 1
          fi
          echo "배포 파일 ${ACTUAL}건:"; find _site -type f -printf '  %f (%s bytes)\n'

      - name: Site regression test
        if: steps.cp.outcome == 'success'
        run: bash scripts/site/test-site.sh

      - name: Upload artifact
        if: steps.cp.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        if: steps.cp.outcome == 'success'
        uses: actions/deploy-pages@v4
