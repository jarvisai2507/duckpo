name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # auto-publish(Auto merge to main)가 머지 후 이 워크플로를 main ref로 dispatch한다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages Source가 "GitHub Actions"일 때만 성공한다.
      # "Deploy from a branch" 소스이거나 Pages가 꺼져 있으면 여기서 실패하는데,
      # 그 경우는 아래 단계를 건너뛰어 잡을 실패시키지 않는다.
      # (branch 소스면 main push만으로 GitHub이 알아서 배포하므로 Actions 배포는 불필요.)
      - id: cp
        name: Configure Pages (GitHub Actions source)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages가 GitHub Actions 소스가 아님
        if: steps.cp.outcome != 'success'
        run: |
          echo "Pages Source가 'GitHub Actions'가 아니거나 Pages가 비활성 상태입니다."
          echo "→ Actions 배포는 건너뜁니다. (branch 소스라면 main push만으로 자동 배포됩니다.)"

      # 배포물에는 화면에 필요한 파일만 담는다.
      # 저장소 루트를 그대로 올리면 CLAUDE.md·docs/·.claude/ 등 내부 문서가
      # 정적 파일로 공개된다(로그인 게이트는 화면 표시만 통제하므로 막지 못한다).
      #
      # 이름을 하나하나 나열하던 방식(2026.7.24)은 새 페이지를 만들 때마다
      # 이 파일을 같이 고쳐야 했고, 실제로 2026.8.5 상황판.html이 이 목록에
      # 빠진 채 push되어 레포에는 있지만 Pages에는 안 뜨는 상태가 발생했다.
      #
      # 순수 확장자 패턴(*.html 전부)으로 바꿨더니 그 즉시 반대 방향 결함이
      # 발견됐다(같은 날 독립검증) — auto-publish.yml이 사람 검토 없이 즉시
      # main에 머지·배포하는 구조라, 세션 중 실수로 만든 최상위 스크래치
      # .html이 하나라도 남아 push되면 그것도 자동으로 공개된다(확장자
      # 안전판은 .html 자체는 걸러내지 못한다). 그래서 .html은 "로그인
      # 게이트를 실제로 담고 있는 파일"만 배포 대상으로 좁힌다 — 진짜 화면
      # 페이지는 전부 #authGate를 갖고 있고, 스크래치 파일은 없다. js/css는
      # 이름 3개뿐이라 그대로 패턴 유지.
      - name: Stage site files (pattern allowlist + gate check)
        if: steps.cp.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          shopt -s nullglob
          for f in *.html; do
            if grep -q 'id="authGate"' "$f"; then
              cp "$f" _site/
            else
              echo "::warning::건너뜀(로그인 게이트 없음, 배포 대상 아님): $f"
            fi
          done
          for f in auth.js theme.css nav.js; do
            [ -f "$f" ] && cp "$f" _site/
          done
          test -f _site/index.html || { echo "::error::index.html 누락 — 배포 중단"; exit 1; }
          # 안전판: 허용 확장자(html/js/css) 외 파일이 섞였는지 기계 확인
          if find _site -type f ! -name '*.html' ! -name '*.js' ! -name '*.css' | grep -q .; then
            echo "::error::_site 에 허용 확장자 외 파일이 있다"; find _site -type f; exit 1
          fi
          echo "배포 파일 $(find _site -type f | wc -l)건:"; find _site -type f -printf '  %f (%s bytes)\n'

      - name: Upload artifact
        if: steps.cp.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        if: steps.cp.outcome == 'success'
        uses: actions/deploy-pages@v4
