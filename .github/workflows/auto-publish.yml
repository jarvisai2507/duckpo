name: Auto merge to main

# 작업 브랜치(claude/**)에 push되면:
#   1) 해당 브랜치를 main에 자동 머지하고
#   2) main 컨텍스트에서 배포하도록 deploy-pages 워크플로를 dispatch한다.
# (Pages 환경은 main 브랜치에서만 배포가 허용되고, workflow_run 컨텍스트는
#  Pages 토큰 권한이 제한되므로 workflow_dispatch로 명시 호출한다.)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 이 워크플로는 사람 검토 없이 즉시 main에 머지하고 즉시 배포까지
      # 이어진다. 그래서 웹사이트 회귀 테스트를 여기, 머지 이전에 걸어
      # 실패하면 애초에 main에 닿지 못하게 한다(2026.8.5 2차 독립검증
      # 지적 — 검사 스크립트를 만들어놓고도 아무 워크플로가 실행하지
      # 않으면 "선언만 있고 강제가 없는" 장식품에 불과하다).
      - name: Site regression test (머지 전 게이트)
        run: bash scripts/site/test-site.sh

      - name: Merge pushed branch into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only "origin/${GITHUB_REF_NAME}" \
            || git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main

      - name: Trigger Pages deploy on main
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
